name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Configuration check
        env:
          NEXT_PUBLIC_BASE_API: http://localhost:5000/api/v1
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: npm run doctor

      # Types are checked explicitly. `next build` would also catch this, but
      # failing early with a clear message is cheaper than a 60s build.
      - name: Type check
        run: npm run typecheck

      # --max-warnings=0 is set in the script: warnings are treated as failures
      # so the lint baseline cannot quietly grow.
      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_BASE_API: http://localhost:5000/api/v1
        run: npm run build

      - name: Check the tree is clean
        # `lint` runs without --fix, so nothing should have been rewritten. A
        # diff here means a formatter disagrees with what is committed.
        run: git diff --exit-code